<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina - Reader Studio</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#22c55e',
              600: '#16a34a',
            },
            night: {
              900: '#0b0f19',
              800: '#111827',
              700: '#1f2937',
              600: '#374151'
            },
            sepia: {
              100: '#fbf0d9',
              200: '#f4ecd8',
              800: '#433422',
              900: '#2c2217'
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Mozilla PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // Set worker source
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* Reader theme modes */
    body.theme-dark {
      background-color: #0b0f19;
      color: #e2e8f0;
    }
    body.theme-light {
      background-color: #f1f5f9;
      color: #0f172a;
    }
    body.theme-light .reader-topbar {
      background-color: #ffffff;
      border-color: #e2e8f0;
      color: #0f172a;
    }
    body.theme-light #pdfViewerContainer {
      background-color: #e2e8f0;
    }
    body.theme-light .theme-card {
      background-color: #ffffff;
      border-color: #e2e8f0;
      color: #0f172a;
    }

    body.theme-sepia {
      background-color: #f4ecd8;
      color: #433422;
    }
    body.theme-sepia .reader-topbar {
      background-color: #fbf0d9;
      border-color: #e6dac1;
      color: #433422;
    }
    body.theme-sepia #pdfViewerContainer {
      background-color: #eae0c8;
    }
    body.theme-sepia .theme-card {
      background-color: #fbf0d9;
      border-color: #e6dac1;
      color: #433422;
    }
    body.theme-sepia canvas {
      filter: sepia(0.35) contrast(0.95);
    }
  </style>
</head>
<body class="theme-dark min-h-screen flex flex-col font-sans select-none overflow-hidden">

  <!-- Reader Top Bar -->
  <header class="reader-topbar h-16 border-b border-slate-800 bg-night-900/95 backdrop-blur px-4 flex items-center justify-between gap-3 z-30 flex-shrink-0 transition-colors">
    
    <!-- Left: Return to Library & Book Title -->
    <div class="flex items-center gap-3 min-w-0">
      <a href="/" class="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white transition-colors flex items-center gap-1.5 text-xs font-semibold" title="Return to Library">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span class="hidden sm:inline">Library</span>
      </a>

      <div class="min-w-0">
        <h1 id="readerTitle" class="text-sm font-bold text-white truncate max-w-xs sm:max-w-md md:max-w-lg">
          Loading Document...
        </h1>
        <p id="readerAuthor" class="text-xs text-emerald-400 truncate">Online Library Edition</p>
      </div>
    </div>

    <!-- Center: Page Controls -->
    <div class="flex items-center gap-1.5 sm:gap-2">
      <button id="prevPageBtn" class="p-2 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white transition-colors" title="Previous Page (Left Arrow)">
        <i data-lucide="chevron-left" class="w-4 h-4"></i>
      </button>

      <div class="flex items-center gap-1.5 text-xs font-mono bg-slate-800/80 px-2.5 py-1 rounded-lg border border-slate-700">
        <span>Page</span>
        <input type="number" id="pageNumberInput" value="1" min="1" class="w-10 text-center bg-transparent text-white font-bold focus:outline-none">
        <span class="text-slate-400">/</span>
        <span id="pageCount" class="text-slate-300 font-bold">--</span>
      </div>

      <button id="nextPageBtn" class="p-2 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white transition-colors" title="Next Page (Right Arrow)">
        <i data-lucide="chevron-right" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Right: Zoom, Theme, Sidebar, Fullscreen -->
    <div class="flex items-center gap-1 sm:gap-2">
      
      <!-- Zoom controls -->
      <div class="hidden md:flex items-center gap-1 bg-slate-800/80 p-1 rounded-lg border border-slate-700">
        <button id="zoomOutBtn" class="p-1.5 hover:text-white text-slate-400 transition-colors" title="Zoom Out (-)">
          <i data-lucide="minus" class="w-3.5 h-3.5"></i>
        </button>
        <span id="zoomLevelText" class="text-xs font-mono px-1.5 text-slate-300">100%</span>
        <button id="zoomInBtn" class="p-1.5 hover:text-white text-slate-400 transition-colors" title="Zoom In (+)">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
        </button>
        <button id="fitWidthBtn" class="p-1.5 hover:text-white text-slate-400 transition-colors ml-1" title="Fit to Width">
          <i data-lucide="move-horizontal" class="w-3.5 h-3.5"></i>
        </button>
      </div>

      <!-- Theme Switcher -->
      <div class="flex items-center gap-1 bg-slate-800/80 p-1 rounded-lg border border-slate-700">
        <button id="themeDarkBtn" class="p-1.5 rounded text-emerald-400 hover:bg-slate-700" title="Night Mode">
          <i data-lucide="moon" class="w-3.5 h-3.5"></i>
        </button>
        <button id="themeSepiaBtn" class="p-1.5 rounded text-amber-400 hover:bg-slate-700" title="Warm Sepia Mode">
          <i data-lucide="sun" class="w-3.5 h-3.5"></i>
        </button>
        <button id="themeLightBtn" class="p-1.5 rounded text-slate-400 hover:bg-slate-700" title="Light Mode">
          <i data-lucide="sun-medium" class="w-3.5 h-3.5"></i>
        </button>
      </div>

      <!-- Action buttons -->
      <button id="downloadPdfBtn" class="p-2 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white transition-colors hidden sm:block" title="Download PDF File">
        <i data-lucide="download" class="w-4 h-4"></i>
      </button>

      <button id="toggleSidebarBtn" class="p-2 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white transition-colors" title="Toggle Notes & Bookmarks">
        <i data-lucide="panel-right" class="w-4 h-4"></i>
      </button>

      <button id="fullscreenBtn" class="p-2 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white transition-colors hidden sm:block" title="Toggle Fullscreen">
        <i data-lucide="maximize" class="w-4 h-4"></i>
      </button>

    </div>
  </header>

  <!-- Reader Body Area -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- PDF Canvas Viewport Container -->
    <div id="pdfViewerContainer" class="flex-1 overflow-auto flex items-start justify-center p-4 sm:p-6 bg-night-950 relative custom-scrollbar">
      
      <!-- Loading Indicator -->
      <div id="pdfLoadingIndicator" class="absolute inset-0 flex flex-col items-center justify-center bg-night-950/90 z-20 space-y-3">
        <div class="w-12 h-12 rounded-full border-4 border-emerald-500/20 border-t-emerald-500 animate-spin"></div>
        <p class="text-sm font-medium text-slate-300">Rendering PDF Page...</p>
        <span class="text-xs text-slate-400">Powered by Mozilla PDF.js & Java SE Engine</span>
      </div>

      <!-- Canvas Wrapper for Drop Shadow -->
      <div class="shadow-2xl rounded-sm overflow-hidden my-auto border border-slate-800/50">
        <canvas id="pdfCanvas" class="block bg-white transition-transform duration-100 origin-top"></canvas>
      </div>

      <!-- Floating Bottom Quick Toolbar for mobile -->
      <div class="sm:hidden fixed bottom-4 left-1/2 -translate-x-1/2 z-20 flex items-center gap-2 bg-slate-900/90 backdrop-blur border border-slate-700 px-4 py-2 rounded-full shadow-2xl">
        <button id="mobPrevBtn" class="p-1 text-slate-300"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
        <span id="mobPageText" class="text-xs font-mono font-bold text-white px-2">1 / --</span>
        <button id="mobNextBtn" class="p-1 text-slate-300"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
      </div>

    </div>

    <!-- Notes & Bookmarks Sidebar Drawer -->
    <aside id="readerSidebar" class="w-80 border-l border-slate-800 bg-night-900 flex-shrink-0 flex flex-col transition-all duration-300 transform translate-x-0 z-20 theme-card">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="book-marked" class="w-4 h-4 text-emerald-400"></i>
          <h3 class="text-sm font-bold text-white">Reading Notes & Log</h3>
        </div>
        <button id="closeSidebarBtn" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="p-4 flex-1 flex flex-col space-y-4 overflow-y-auto custom-scrollbar">
        <!-- Progress Summary -->
        <div class="bg-slate-800/60 rounded-xl p-3 border border-slate-700 space-y-2">
          <div class="flex items-center justify-between text-xs">
            <span class="text-slate-400">Progress</span>
            <span id="progressPercent" class="font-bold text-emerald-400">0%</span>
          </div>
          <div class="w-full h-1.5 bg-slate-700 rounded-full overflow-hidden">
            <div id="progressBar" class="h-full bg-emerald-500 w-0 transition-all duration-300"></div>
          </div>
        </div>

        <!-- Notes Area -->
        <div class="flex-1 flex flex-col space-y-2">
          <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center justify-between">
            <span>Personal Annotations</span>
            <span class="text-[10px] text-emerald-400">Auto-saved</span>
          </label>
          <textarea 
            id="bookNotesInput" 
            placeholder="Type your personal insights, quotes, and reading thoughts here... They save automatically to your shelf!" 
            class="flex-1 w-full bg-slate-950/80 border border-slate-700 rounded-xl p-3 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-emerald-500 resize-none font-sans leading-relaxed"
          ></textarea>
        </div>

        <!-- Quick Jump to Page -->
        <div class="pt-2 border-t border-slate-800 space-y-2">
          <span class="text-xs font-semibold text-slate-400">Quick Navigation:</span>
          <div class="grid grid-cols-3 gap-2 text-xs">
            <button id="btnJumpStart" class="py-1.5 px-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 text-center font-medium">Cover</button>
            <button id="btnJumpMiddle" class="py-1.5 px-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 text-center font-medium">Middle</button>
            <button id="btnJumpEnd" class="py-1.5 px-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 text-center font-medium">Last Page</button>
          </div>
        </div>

      </div>
    </aside>

  </div>

  <script src="/js/reader.js"></script>
</body>
</html>
